services:
  api:
    build: ./backend
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?Copy .env.example to .env}
      MONGODB_URL: ${MONGODB_URL:?Copy .env.example to .env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-integradora}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?Set KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?Set KEYCLOAK_JWKS_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-flutter-mobile}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      - postgres
      - mongodb
      - keycloak
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-integradora}
      POSTGRES_USER: ${POSTGRES_USER:-prototype}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-dev-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a development password}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
volumes:
  postgres_data:
  mongodb_data:
